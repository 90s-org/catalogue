name: catalogue-ci

# Equivalent of the Jenkinsfile's `@Library('jenkins-shared-library') _` +
# `nodejsEKSPipeline(configMap)` call — this repo just calls the shared
# reusable workflow instead of copy-pasting the pipeline. Runs automatically
# on every push to a feature branch (not main — main is the promotion path,
# argocd-gitops-spec.md Phase C/D), and can also be run manually.
on:
  push:
  workflow_dispatch:
 
jobs:
  feature-pipeline:
    if: github.ref_name != 'main'
    uses: 90s-org/workflows/.github/workflows/nodejs-eks-ci.yaml@main
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    with:
      project: roboshop
      component: catalogue
    secrets: inherit

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: {{ .Values.namespace }}
  # labels related to deployment resource
  labels:
    project: roboshop
    tier: backend
    component: catalogue
spec:
  # No replicas field here on purpose — the HPA in hpa.yaml owns .spec.replicas
  # via the scale subresource once it's running. Setting it here too makes every
  # helm upgrade fight the HPA controller for field ownership and fail with a
  # server-side-apply conflict.
  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: catalogue
  # Pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: catalogue
    spec:
      containers:
      - name: catalogue
        image: "{{ .Values.deployment.imageRepo }}:{{ .Values.deployment.imageVersion }}"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        envFrom:
        - configMapRef:
            name: catalogue
